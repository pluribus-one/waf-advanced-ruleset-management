daemon off;
master_process off;
# worker_processes  1;

# on linux load a module:
load_module modules/libwarm.so;

error_log /dev/stdout debug;
# error_log error.log debug;

events { }

http {
    warm_load_rules /etc/warm/crs;
    warm_load_config /etc/warm/crs-setup-pl4.conf;
    warm_load_config /etc/warm/modsecurity.conf;
    warm_load_model /etc/warm/model.bin;

    server {
        listen *:8000;
        server_name localhost;

        location / {    #Warm is enabled by default so here warm is enabled

        }

        location /waf {
            warm on;
        }

        location /nowaf {
            warm off;
        }


        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}